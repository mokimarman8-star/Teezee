name: Teezee Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, for example 1.0.3; leave empty for automatic increment'
        required: false
        default: ''
        type: string
      bump:
        description: 'Version bump when version is empty'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Teezee
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner zipalign zip unzip

      - name: Determine and validate release version
        id: versioning
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' && -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$EVENT_REF" == refs/tags/v* ]]; then
            VERSION="${EVENT_REF#refs/tags/v}"
          else
            BUMP="${INPUT_BUMP:-patch}"
            case "$BUMP" in
              patch|minor|major) ;;
              *) echo 'Invalid bump value' >&2; exit 1 ;;
            esac
            VERSION="$(python3 scripts/auto_tag.py "$BUMP")"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"

          # A tag-triggered run must build the commit that the tag actually names.
          # A manually requested or main-branch release creates the tag once.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$EVENT_REF" == refs/tags/* && "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG does not point to this workflow commit" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Teezee release $TAG"
            git push origin "$TAG"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Build, align, sign and verify APK
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh "${{ steps.versioning.outputs.version }}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.versioning.outputs.tag }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          set -Eeuo pipefail
          APK_FILE="dist/Teezee-v${VERSION}.apk"
          SHA_FILE="dist/Teezee-v${VERSION}.apk.sha256"
          SHA_VAL="$(awk '{print $1}' "$SHA_FILE")"
          SIZE="$(du -h "$APK_FILE" | awk '{print $1}')"

          cat > release_notes.md <<EOF
          ## Teezee Android ${TAG_NAME}

          **Artifact:** \\`Teezee-v${VERSION}.apk\\`
          **Size:** ${SIZE}
          **SHA-256:** \\`${SHA_VAL}\\`
          **APK signatures:** v1, v2 and v3 verified by the build script.
          **Declared package:** \\`com.teezee.app\\`
          **Declared ABI:** ARM64-v8a and armeabi-v7a, as packaged in the source APK.

          This release records packaging, alignment and signature verification. It does not claim that an ARM device launch has been validated in GitHub-hosted infrastructure; device launch validation requires a compatible physical ARM device or ARM-capable runner.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Teezee ${TAG_NAME}" --notes-file release_notes.md
            gh release upload "$TAG_NAME" "$APK_FILE" "$SHA_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$APK_FILE" "$SHA_FILE" \
              --title "Teezee ${TAG_NAME}" \
              --notes-file release_notes.md
          fi
