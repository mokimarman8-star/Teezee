name: Automated Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.3, leave empty for auto-increment)'
        required: false
        default: ''
      bump:
        description: 'Version bump type (if version not specified)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Build & Signing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner zipalign zip unzip

      - name: Determine Release Version & Create Tag
        id: versioning
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
            VER="${RAW_VER#v}"
            TAG="v$VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            BUMP="${{ github.event.inputs.bump || 'patch' }}"
            VER=$(python3 scripts/auto_tag.py "$BUMP")
            TAG="v$VER"
          fi
          
          echo "Target Version: $VER"
          echo "Target Tag: $TAG"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating git tag $TAG..."
            git tag -a "$TAG" -m "Automated Release $TAG"
            git push origin "$TAG" || echo "Tag push skipped or already exists"
          fi

      - name: Build & Sign APK
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh "${{ steps.versioning.outputs.version }}"

      - name: Create GitHub Release & Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.versioning.outputs.tag }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          APK_FILE="dist/Teezee-v${VERSION}.apk"
          SHA_FILE="dist/Teezee-v${VERSION}.apk.sha256"
          SHA_VAL=$(cat "$SHA_FILE" | awk '{print $1}')
          
          cat << EONOTES > release_notes.md
          ## 🚀 Teezee Android Release ${TAG_NAME}
          
          ### 📦 Artifact Details
          - **File:** \`Teezee-v${VERSION}.apk\`
          - **Size:** $(ls -lh "$APK_FILE" | awk '{print $5}')
          - **SHA-256 Checksum:** \`${SHA_VAL}\`
          - **Signing Schemes:** v1 (JAR), v2 (APK Signature Scheme), v3 (APK Signature Scheme v3)
          - **Target Android Version:** Android 6.0 (API 23) - Android 15 (API 35)
          
          ### ✨ Improvements & Fixes
          - Fixed package signature and META-INF integrity issues preventing installation ("App not installed").
          - Strict 4-byte zip alignment applied.
          - Multi-scheme signature verification (v1, v2, v3) with zero warnings.
          - Verified native library architecture support for ARM64-v8a and ARMEABI-v7a.
          - Fully automated CI/CD release workflow.
          EONOTES
          
          gh release delete "$TAG_NAME" -y || true
          
          gh release create "$TAG_NAME" \
            "$APK_FILE" \
            "$SHA_FILE" \
            --title "Teezee ${TAG_NAME}" \
            --notes-file release_notes.md
