name: Teezee Android Compatibility Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build signed Teezee APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Teezee repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install APK packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner zipalign zip unzip

      - name: Build release APK
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh 1.0.8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: teezee-v1.0.8-apk
          path: |
            dist/Teezee-v1.0.8.apk
            dist/Teezee-v1.0.8.apk.sha256
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Android ${{ matrix.label }} install and launch
    needs: build-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '10 (API 29)'
            api-level: '29'
            system-image-api-level: '29'
            target: default
            channel: stable
          - label: '11 (API 30)'
            api-level: '30'
            system-image-api-level: '30'
            target: default
            channel: stable
          - label: '14 (API 34)'
            api-level: '34'
            system-image-api-level: '34'
            target: google_apis
            channel: stable
          - label: '15 (API 35)'
            api-level: '35'
            system-image-api-level: '35'
            target: google_apis
            channel: stable
          - label: '16 (API 36)'
            api-level: '36'
            system-image-api-level: '36'
            target: google_apis
            channel: stable
          - label: '17 (API 37 preview)'
            api-level: '37.0'
            system-image-api-level: '37.0'
            target: google_apis
            channel: beta

    steps:
      - name: Checkout exact Teezee repository
        uses: actions/checkout@v4

      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: teezee-v1.0.8-apk
          path: ci-artifacts

      - name: Set up Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          system-image-api-level: ${{ matrix.system-image-api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          channel: ${{ matrix.channel }}
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          force-avd-creation: true
          script: bash scripts/ci_smoke_test.sh "$GITHUB_WORKSPACE/ci-artifacts/Teezee-v1.0.8.apk"

      - name: Upload install-launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teezee-${{ matrix.label }}-evidence
          path: ci-artifacts/evidence
          if-no-files-found: warn
          retention-days: 14
